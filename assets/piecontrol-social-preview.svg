<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PieControl — Android edge menu</title>
  <desc id="desc">A branded PieControl social preview with the current blue and deep-yellow two-ring icon and a phone showing only the two-ring menu on a dark neutral background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.58" stop-color="#121a2d"/>
      <stop offset="1" stop-color="#17253a"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="0.78" cy="0.48" r="0.54">
      <stop offset="0" stop-color="#28556d" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#28556d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B800"/>
      <stop offset="1" stop-color="#F2D15D"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a9b8d0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#03060d" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- Dark, abstract background; no app screenshot or interface imagery. -->
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="1050" cy="320" rx="420" ry="380" fill="url(#rightGlow)"/>
  <circle cx="1059" cy="320" r="304" fill="none" stroke="#a7bfd5" stroke-opacity="0.045" stroke-width="1.5"/>
  <circle cx="1059" cy="320" r="258" fill="none" stroke="#a7bfd5" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- The current launcher icon: blue and deep yellow, two rings, round center dot. -->
  <svg x="96" y="96" width="72" height="72" viewBox="0 0 96 96" aria-hidden="true">
    <rect x="5" y="5" width="86" height="86" rx="22" fill="#141425" stroke="#ffffff" stroke-opacity="0.14"/>
    <g transform="translate(48,48) scale(0.62) translate(-48,-48)">
      <path d="M63 12 A36 36 0 0 0 63 84" fill="none" stroke="#3A86B8" stroke-width="7.2" stroke-linecap="round"/>
      <path d="M63 24.75 A23.25 23.25 0 0 0 63 71.25" fill="none" stroke="#E5B800" stroke-width="7.2" stroke-linecap="round"/>
      <g fill="none" stroke="#141425" stroke-width="0.75" stroke-linecap="butt">
        <path d="M34.75 31.69 L28.90 28.31"/>
        <path d="M34.75 64.31 L28.90 67.69"/>
        <path d="M45.79 38.06 L39.94 34.69"/>
        <path d="M45.79 57.94 L39.94 61.31"/>
      </g>
      <circle cx="63" cy="48" r="7" fill="#F7F9FC" stroke="#141425" stroke-width="2.4"/>
    </g>
  </svg>

  <text x="184" y="124" fill="#f4f7fb" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" letter-spacing="3.1">PIECONTROL</text>
  <text x="185" y="149" fill="#91a1b8" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.2">ANDROID EDGE MENU</text>

  <rect x="96" y="181.4" width="198" height="35.2" rx="17.6" fill="#E5B800" fill-opacity="0.11" stroke="#E5B800" stroke-opacity="0.36"/>
  <circle cx="114" cy="199" r="4" fill="#E5B800"/>
  <text x="127" y="203" fill="#f1d56b" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.3">MADE FOR ONE SWIPE</text>

  <text x="96" y="277" fill="#f7f9fc" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.4">Your favorite actions,</text>
  <text x="96" y="341" fill="#f7f9fc" font-family="DejaVu Sans, sans-serif" font-size="59" font-weight="700" letter-spacing="-2.1">one <tspan fill="url(#goldAccent)">swipe</tspan> away.</text>

  <text x="99" y="389" fill="#bac5d6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">A customizable Android pie menu for navigation,</text>
  <text x="99" y="416" fill="#bac5d6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">apps, and shortcuts — right at the screen edge.</text>

  <g transform="translate(96 449)">
    <rect width="171" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="21" cy="20" r="5" fill="#3A86B8"/>
    <text x="36" y="24" fill="#e2e9f2" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.55">UP TO 3 RINGS</text>
  </g>
  <g transform="translate(279 449)">
    <rect width="201" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="21" cy="20" r="5" fill="#E5B800"/>
    <text x="36" y="24" fill="#e2e9f2" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.55">APPS + SHORTCUTS</text>
  </g>
  <g transform="translate(492 449)">
    <rect width="237" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="21" cy="20" r="5" fill="#3A86B8"/>
    <text x="36" y="24" fill="#e2e9f2" font-family="DejaVu Sans, sans-serif" font-size="11.2" font-weight="700" letter-spacing="0.25">OPT-IN APP SUGGESTIONS</text>
  </g>

  <line x1="98" y1="512" x2="742" y2="512" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="98" y="540" fill="#8594aa" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="500">github.com/lnovelli/pie-control</text>
  <text x="742" y="540" fill="#63748b" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="end" letter-spacing="1.2">CUSTOMIZE YOUR EDGE</text>

  <!-- Neutral phone mockup: a plain screen with only the two-ring menu. -->
  <g filter="url(#phoneShadow)">
    <rect x="920" y="94" width="260" height="450" rx="42" fill="#070b12" stroke="#d5e1ee" stroke-opacity="0.36" stroke-width="2"/>
    <rect x="936" y="110" width="228" height="418" rx="30" fill="#151B28"/>
    <rect x="1038" y="99" width="24" height="4" rx="2" fill="#2a303c"/>
    <circle cx="1074" cy="101" r="2.1" fill="#333b49"/>
    <g fill="none" stroke-linecap="round">
      <path d="M1114 184 A136 136 0 0 0 1114 456" stroke="#3A86B8" stroke-width="20"/>
      <path d="M1114 232 A88 88 0 0 0 1114 408" stroke="#E5B800" stroke-width="20"/>
    </g>
    <g fill="none" stroke="#151B28" stroke-width="3" stroke-linecap="butt">
      <path d="M1006.61 258 L985.83 246"/>
      <path d="M1006.61 382 L985.83 394"/>
      <path d="M1048.18 282 L1027.40 270"/>
      <path d="M1048.18 358 L1027.40 370"/>
    </g>
    <circle cx="1114" cy="320" r="19" fill="#F7F9FC" stroke="#141425" stroke-width="4.8"/>
    <rect x="936" y="110" width="228" height="418" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
  </g>
</svg>
